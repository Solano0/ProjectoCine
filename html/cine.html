<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Selección de Asientos y Compra</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="seats-section">
            <div class="screen">Pantalla</div>
            <div class="seats-container">
                <div class="row">
                    <div class="seat available" data-seat="1"></div>
                    <div class="seat available" data-seat="2"></div>
                    <div class="seat available" data-seat="3"></div>
                    <div class="seat available" data-seat="4"></div>
                    <div class="seat available" data-seat="5"></div>
                </div>
                <div class="row">
                    <div class="seat available" data-seat="6"></div>
                    <div class="seat available" data-seat="7"></div>
                    <div class="seat occupied" data-seat="8"></div>
                    <div class="seat available" data-seat="9"></div>
                    <div class="seat available" data-seat="10"></div>
                </div>
                <div class="row">
                    <div class="seat available" data-seat="11"></div>
                    <div class="seat available" data-seat="12"></div>
                    <div class="seat available" data-seat="13"></div>
                    <div class="seat available" data-seat="14"></div>
                    <div class="seat occupied" data-seat="15"></div>
                </div>
                <div class="row">
                    <div class="seat available" data-seat="16"></div>
                    <div class="seat available" data-seat="17"></div>
                    <div class="seat available" data-seat="18"></div>
                    <div class="seat available" data-seat="19"></div>
                    <div class="seat available" data-seat="20"></div>
                </div>
            </div>
        </div>
        <div class="crud-section">
            <h2>Gestión de Compra</h2>
            <form>
                <label for="seat-number">ID</label>
                <input type="text" id="id_asiento" name="id_asiento" required>

                <label for="seat-number">Número de Asiento:</label>
                <input type="text" id="seat-number" name="seat-number" readonly>
                
                <label for="total-price">Precio Total:</label>
                <input type="text" id="total-price" name="total-price" readonly>

                <label for="customer-name">Nombre del Cliente:</label>
                <input type="text" id="customer-name" name="customer-name" required>
                
                <label for="customer-email">Email del Cliente:</label>
                <input type="email" id="customer-email" name="customer-email" required>

                <div class="button-group">
                    <button type="submit">Comprar</button>
                    <button type="button">Actualizar</button>
                    <button type="button">Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js /cine.js"></script>
</body>
</html>
