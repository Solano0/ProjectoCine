<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginCine</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <section>
        <!-- Aquí van las etiquetas span (puedes omitirlas si son solo para decoración) -->
        <div class="signin">
            <div class="content">
                <h2>Inicia Sesión</h2>
                <div class="form">
                    <div class="inputBox">
                        <input type="text" required>
                        <i>Usuario o Correo</i>
                    </div>
                    <div class="inputBox">
                        <input type="password" required>
                        <i>Contraseña</i>
                    </div>
                    <div class="links">
                        <a href="#">¿Olvidaste la Contraseña?</a>
                        <a href="#">Registrate</a>
                    </div>
                    <div class="inputBox">
                        <!-- En lugar de un botón submit, usa un enlace con apariencia de botón -->
                        <a href="index.html" class="button">Iniciar</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
